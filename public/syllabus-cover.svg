<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="goldGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141418" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#fff6a3" />
      <stop offset="70%" stop-color="#ffd700" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="800" fill="url(#cardGrad)" rx="28" />
  
  <!-- Subtle Ambient Glow -->
  <circle cx="400" cy="380" r="320" fill="url(#goldGlow)" />

  <!-- Outer Elegant Gold Border -->
  <rect x="16" y="16" width="768" height="768" fill="none" stroke="url(#goldBorder)" stroke-width="2.5" rx="20" />
  
  <!-- Corner Tech Accents -->
  <path d="M 32 60 L 32 32 L 60 32" fill="none" stroke="#ffd700" stroke-width="3" />
  <path d="M 768 60 L 768 32 L 740 32" fill="none" stroke="#ffd700" stroke-width="3" />
  <path d="M 32 740 L 32 768 L 60 768" fill="none" stroke="#ffd700" stroke-width="3" />
  <path d="M 768 740 L 768 768 L 740 768" fill="none" stroke="#ffd700" stroke-width="3" />

  <!-- Top Pill Badge -->
  <g transform="translate(400, 110)">
    <rect x="-190" y="-22" width="380" height="44" rx="22" fill="#ffd700" fill-opacity="0.12" stroke="#ffd700" stroke-width="1.5" stroke-opacity="0.45" />
    <circle cx="-160" cy="0" r="5" fill="#ffd700" />
    <text x="-142" y="5" font-family="'Geist', -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffd700" letter-spacing="1.5">OFFICIAL TN SKILLS (TNSDC) PARTNER</text>
  </g>

  <!-- Central Logo Emblem -->
  <g transform="translate(400, 310)">
    <!-- White Logo Backplate Container -->
    <rect x="-150" y="-95" width="300" height="190" rx="18" fill="#ffffff" filter="drop-shadow(0 15px 35px rgba(255,215,0,0.35))" />
    
    <!-- PLANT GREEN INERTIA Typography inside Backplate -->
    <text x="-120" y="-20" font-family="'Barlow Condensed', 'Arial Black', sans-serif" font-size="62" font-weight="900" fill="#18181b" letter-spacing="0">PLANT</text>
    <text x="-120" y="44" font-family="'Barlow Condensed', 'Arial Black', sans-serif" font-size="62" font-weight="900" fill="#18181b" letter-spacing="0">GREEN</text>
    
    <!-- Vertical Green Inertia Block -->
    <rect x="62" y="-72" width="48" height="144" rx="4" fill="#15803d" />
    <text x="86" y="0" font-family="'Barlow Condensed', sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="5" text-anchor="middle" transform="rotate(-90 86 0)">INERTIA</text>
  </g>

  <!-- Syllabus Heading -->
  <text x="400" y="500" font-family="'Geist', -apple-system, sans-serif" font-size="44" font-weight="800" fill="url(#goldText)" text-anchor="middle" letter-spacing="-0.5">
    Course Syllabus
  </text>
  
  <text x="400" y="550" font-family="'Geist', -apple-system, sans-serif" font-size="20" font-weight="500" fill="#e4e4e7" text-anchor="middle" opacity="0.9">
    7 Weeks • 100+ Hours Live Experiential Curriculum
  </text>

  <!-- Modules Tag & Arrow -->
  <g transform="translate(400, 640)">
    <rect x="-140" y="-24" width="280" height="48" rx="24" fill="#000000" stroke="#ffd700" stroke-width="1.8" />
    <text x="-95" y="6" font-family="'Geist', -apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffd700">Explore Modules 01 to 07</text>
    <path d="M 85 0 L 105 0 M 98 -6 L 105 0 L 98 6" fill="none" stroke="#ffd700" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
